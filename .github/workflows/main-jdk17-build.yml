name: main jdk17 build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl

      - name: Build with Maven
        id: maven_tests
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Detect failed Maven tests
        id: detect_failed_tests
        if: ${{ failure() && steps.maven_tests.outcome == 'failure' }}
        run: python3 .github/scripts/check_failed_tests.py

      - name: Rickroll on failed Maven tests
        if: ${{ failure() && steps.detect_failed_tests.outputs.test_failed == 'true' }}
        uses: ./.github/actions/rickroll

  security:
    name: Semgrep security check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: python3 -m pip install semgrep==1.185.0

      - name: Check new vulnerabilities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::Invalid baseline commit"
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}" || exit 1

          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --config .semgrep/command-injection-process-builder.yaml \
            --baseline-commit "$BASE_SHA" \
            --error .

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run E2E Tests
        id: e2e
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Detect failed E2E tests
        id: detect_failed_e2e
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        run: python3 .github/scripts/check_failed_tests.py

      - name: Rickroll on failed E2E tests
        if: ${{ failure() && steps.detect_failed_e2e.outputs.test_failed == 'true' }}
        uses: ./.github/actions/rickroll
